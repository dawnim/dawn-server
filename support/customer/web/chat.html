<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>在线客服</title>
    <link rel="stylesheet" href="/support-assets/chat.css" />
    <link rel="stylesheet" href="/support-assets/markdown.css" />
    <script src="/support-assets/markdown.js" defer></script>
    <script src="/support-assets/chat.js" defer></script>
  </head>
  <body>
    <main id="app">
      <header>
        <img id="avatar" alt="" hidden /><span id="avatar-fallback"
          ><svg viewBox="0 0 24 24">
            <path
              d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H3v6h4v-6H4Zm16 0h1v6h-4v-6h3Zm0 6c0 3-3 3-6 3M10 21h4"
            /></svg
        ></span>
        <div class="brand">
          <strong id="brand"></strong><small id="status" role="status"></small>
        </div>
        <button
          id="theme"
          class="icon-button"
          type="button"
          aria-label="主题"
        ></button>
        <button id="close" type="button" hidden aria-label="关闭">×</button>
      </header>
      <aside id="notice" role="alert" hidden></aside>
      <div id="messages" role="log" aria-live="polite">
        <button id="older" type="button" hidden data-t="加载更早消息"></button>
        <p id="greeting"></p>
        <div id="history"></div>
      </div>
      <div class="composer-shell">
        <div id="emoji-panel" hidden role="group"></div>
        <div class="tools">
          <button
            id="emoji-toggle"
            class="icon-button"
            type="button"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M8 14s1.3 2 4 2 4-2 4-2M8.5 9h.01M15.5 9h.01" />
            </svg></button
          ><button id="human" type="button" data-t="转人工"></button
          ><button id="end" type="button" hidden data-t="结束咨询"></button
          ><span id="connection"></span>
        </div>
        <form id="composer">
          <textarea id="input" rows="3" maxlength="16000" disabled></textarea
          ><button id="send" type="submit" disabled data-t="发送"></button>
        </form>
      </div>
    </main>
  </body>
</html>
