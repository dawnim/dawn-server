name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: test-only, MYSQL_DATABASE: dawn_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only" --health-interval=10s --health-retries=10
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: test-only, MARIADB_DATABASE: dawn_test }
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-retries=10
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test-only, POSTGRES_DB: dawn_test }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -run 'Test(Application|DatabaseMatrix)$' -count=1 ./tests
        env:
          DAWN_TEST_DRIVER: mysql
          DAWN_TEST_DSN: root:test-only@tcp(127.0.0.1:3306)/dawn_test?charset=utf8mb4&parseTime=true&loc=UTC
      - run: go test -run 'Test(Application|DatabaseMatrix)$' -count=1 ./tests
        env:
          DAWN_TEST_DRIVER: mariadb
          DAWN_TEST_DSN: root:test-only@tcp(127.0.0.1:3307)/dawn_test?charset=utf8mb4&parseTime=true&loc=UTC
      - run: go test -run 'Test(Application|DatabaseMatrix)$' -count=1 ./tests
        env:
          DAWN_TEST_DRIVER: pgsql
          DAWN_TEST_DSN: host=127.0.0.1 user=postgres password=test-only dbname=dawn_test sslmode=disable
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
