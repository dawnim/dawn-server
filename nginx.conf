# 完整独立配置: nginx -t -c /absolute/path/nginx.conf
# 上线时替换server_name、root和证书路径. 多实例追加各upstream的server即可.
worker_processes auto;
pid /tmp/dawn-nginx.pid;
error_log /tmp/dawn-nginx-error.log warn;

events { worker_connections 4096; }

http {
    default_type application/octet-stream;
    # 不依赖系统mime.types路径, 直接列出构建产物需要的类型.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        image/webp webp;
        image/x-icon ico;
        font/woff2 woff2;
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream dawn_http {
        server 127.0.0.1:5123;
        # server 10.0.0.12:5123;
        keepalive 32;
    }
    upstream dawn_ws {
        least_conn;
        server 127.0.0.1:8851;
        # server 10.0.0.12:8851;
    }
    server {
        listen 8080;
        server_name localhost;
        root /srv/my-admin/admin/dist;
        index index.html;

        # 生产改为 listen 443 ssl; 配置真实域名和证书后启用:
        # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        client_max_body_size 101m;
        client_body_timeout 120s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /admin/ {
            proxy_pass http://dawn_http;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location /api/ {
            proxy_pass http://dawn_http;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /ws {
            # 外部/ws -> 内部/, WS_PATH更改时同步这里.
            proxy_pass http://dawn_ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
        location / { try_files $uri $uri/ /index.html; }
        location ~ /\. { deny all; }
    }
    # 生产启用HTTPS时, 可同时启用以下跳转:
    # server { listen 80; server_name example.com; return 301 https://$host$request_uri; }
}
